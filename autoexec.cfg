// =========================================GENERAL========================================= \\


// STEAM LAUNCH OPTIONS (FOR PERFORMANCE) \\
// YOU MUST CHANGE THE -freq 60 LAUNCH OPTION TO MATCH YOUR MONITOR'S REFRESH RATE (E.G. -freq 144). \\
// -novid -nojoy -nosteamcontroller -nohltv -high -freq 60 -noff -console

// LIMIT FRAMES PER SECOND (fps_max 0 FOR NO LIMIT) \\
mat_vsync 0
fps_max 60

// SHOW FRAMES PER SECOND \\
cl_showfps 1

// SET QUEUED MULTITHREADING \\
mat_queue_mode 2

// QUALITY OF LIFE CHANGES (GAMEPLAY) \\
tf_sniper_fullcharge_bell 1
tf_medigun_autoheal 1
hud_fastswitch 1
cl_autoreload 1
viewmodel_fov 82
fov_desired 90

// QUALITY OF LIFE CHANGES (HUD) \\
cl_disablehtmlmotd 1
tf_item_inspect_model_auto_spin 0
tf_dashboard_slide_time 0
cl_hud_minmode 1
cl_spec_carrieditems 0
cl_showbackpackrarities 0
cl_show_market_data_on_items 0
hud_combattext_batching 1
hud_combattext_batching_window 0.2


// =======================================PERFORMANCE======================================= \\


// HUD CHANGES \\
tf_quest_map_tuner_wobble_magnitude 0
cl_hud_playerclass_use_playermodel 0
tf_enable_glows_after_respawn 0
glow_outline_effect_enable 0

// DISABLE ANTI-ALIASING \\
mat_software_aa_quality 0
mat_antialias 0
mat_aaquality 0

// DISABLE BULLET TRACERS, MUZZLE FLASH & SHELL CASINGS \\
r_drawtracers_firstperson 0
tracer_extra 0
muzzleflash_light 0
cl_muzzleflash_dlight_1st 0
cl_ejectbrass 0

// DISABLE RAGDOLLS \\
